<!DOCTYPE HTML>
<html>
<head>
    <title>Delete Product</title>
</head>
<body>
    <h1>Delete Product</h1>
    <p>Are you sure you want to delete this product "{{ product.name }}"?</p>
    
    <form method="post">
        <button type="submit">Yes, delete.</button>
    </form>

    <a href="{% url 'product_detail' product.pk %}">Cancel</a>
</body>
</html>
